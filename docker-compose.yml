# Name that we're going to provide to the group of containers
# We'll see that in docker desktop once we start the containers
name: Django-ORM-Mastery


# Define our first service
services:
  postgres:
    image: postgres:latest  # Using our downloaded image and it's version
    container_name: postgres_db # naming the container
    restart: always # Ensuring the database automatically comes back online if it ever stops unexpectedly
    # We need to provide some data in order to start our Postgres software in the container
    # We are passing in env variables for the database
    # Docker will read .env file
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
  
  django:
    build: .
    container_name: django_app
    restart: always
    depends_on:
      - postgres
    volumes:
      - ./app:/app  # bind our app directory to the app directory inside the container
    ports:
      - "8000:8000"
    env_file:
      - .env  # loading our environment variables from our .env file
      
    # automate some creations like migrations, create super user and etc...
    command: >
      sh -c "
        if python manage.py shell -c 'from django.contrib.auth.models import User; print(User.objects.filter(username=\"admin\").exists())' | grep -q 'True'; then
          echo 'Admin user exists, skipping app and database setup';
        else
          echo 'Setting up database and creating admin user' &&
          rm -f inventory/migrations/0001_initial.py &&
          python manage.py migrate &&
          python manage.py makemigrations &&
          python manage.py migrate inventory &&
          python manage.py shell -c 'from django.contrib.auth.models import User; User.objects.create_superuser(\"admin\", \"admin@example.com\", \"admin\")';
        fi &&
        uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload
      "